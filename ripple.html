<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let raf = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

const easeOut = (t) => 1 - Math.pow(1 - t, 3);

function play(origin) {
  cancelAnimationFrame(raf);
  resize();
  const DURATION = 1100;
  const MAX_R = Math.min(innerWidth * 0.45, 760);
  const rings = [0, 130, 260]; // stagger delays (ms)
  const start = performance.now();

  function frame(now) {
    const el = now - start;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = false;
    rings.forEach((delay, i) => {
      const t = (el - delay) / DURATION;
      if (t < 0) { alive = true; return; }
      if (t > 1) return;
      alive = true;
      const e = easeOut(t);
      const r = e * MAX_R * (1 - i * 0.12);
      const alpha = (1 - t) * (0.55 - i * 0.12);
      const width = Math.max(1, 5 * (1 - t));

      // soft glow band
      const g = ctx.createRadialGradient(origin.x, origin.y, Math.max(0, r - 40), origin.x, origin.y, r + 8);
      g.addColorStop(0, 'rgba(160,200,255,0)');
      g.addColorStop(0.85, `rgba(160,200,255,${alpha * 0.25})`);
      g.addColorStop(1, 'rgba(160,200,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, r + 8, 0, Math.PI * 2);
      ctx.fill();

      // crisp ring
      ctx.strokeStyle = `rgba(220,235,255,${alpha})`;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, r, 0, Math.PI * 2);
      ctx.stroke();
    });
    if (alive) raf = requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  }
  raf = requestAnimationFrame(frame);
}

window.island.onRipple(play);
</script>
</body>
</html>
