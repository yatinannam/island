<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    /* Expanded size: must match SHAPE_W / SHAPE_H in main.js */
    --w: 380px;
    --h: 140px;
    /* Collapsed size: a sliver tucked into the top edge */
    --cw: 150px;
    --ch: 0px;
    --r: 32px;    /* bottom corner radius when open */
    --ear: 14px;  /* concave curve joining the shape to the screen edge */
    --bg: #000;
    --label: #f5f5f7;
    --label-2: rgba(235, 235, 245, 0.6);
    --label-3: rgba(235, 235, 245, 0.35);
    /* Overwritten by the spring generator below */
    --ease-open: cubic-bezier(0.34, 1.4, 0.64, 1);
    --dur-open: 520ms;
    --ease-close: cubic-bezier(0.4, 0, 0.2, 1);
    --dur-close: 340ms;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--label);
    user-select: none;
    cursor: default;
  }

  /* The island grows out of the top edge. Width/height carry the spring;
     centered with translateX so it grows evenly from the middle. */
  .island {
    position: absolute; top: 0; left: 50%;
    width: var(--cw); height: var(--ch);
    transform: translateX(-50%);
    transition-property: width, height;
    transition-duration: var(--dur-close);
    transition-timing-function: var(--ease-close);
  }
  .open .island {
    width: var(--w); height: var(--h);
    transition-duration: var(--dur-open);
    transition-timing-function: var(--ease-open);
  }

  .shape {
    position: absolute; inset: 0;
    background: var(--bg);
    border-radius: 0 0 var(--r) var(--r);
    overflow: hidden;
    box-shadow: 0 0 0 rgba(0, 0, 0, 0);
    transition: box-shadow 200ms ease;
  }
  .open .shape { box-shadow: 0 14px 34px rgba(0, 0, 0, 0.32), 0 3px 10px rgba(0, 0, 0, 0.18); }

  /* Ears: concave fillets so the island looks attached to the screen edge */
  .island::before, .island::after {
    content: ""; position: absolute; top: 0;
    width: var(--ear); height: var(--ear);
    opacity: 0; transition: opacity 120ms ease;
  }
  .island::before {
    left: calc(-1 * var(--ear) + 0.5px);
    background: radial-gradient(circle at 0 100%, transparent calc(var(--ear) - 0.75px), var(--bg) var(--ear));
  }
  .island::after {
    right: calc(-1 * var(--ear) + 0.5px);
    background: radial-gradient(circle at 100% 100%, transparent calc(var(--ear) - 0.75px), var(--bg) var(--ear));
  }
  .open .island::before, .open .island::after { opacity: 1; transition-duration: 60ms; }

  /* Content keeps its final width so text never reflows mid-animation */
  .content {
    position: absolute; top: 0; left: 50%;
    width: var(--w); height: var(--h);
    padding: 16px 22px 0;
    box-sizing: border-box;
    opacity: 0;
    filter: blur(6px);
    transform: translateX(-50%) scale(0.94);
    transform-origin: 50% 0;
    transition: opacity 110ms ease, filter 110ms ease, transform 160ms ease;
  }
  .open .content {
    opacity: 1; filter: blur(0); transform: translateX(-50%);
    transition: opacity 240ms ease 90ms, filter 240ms ease 90ms, transform var(--dur-open) var(--ease-open) 40ms;
  }

  .row { display: flex; align-items: center; gap: 12px; height: 48px; }
  .art {
    width: 48px; height: 48px; flex: none; border-radius: 11px;
    background: linear-gradient(140deg, #6e8bff 0%, #a76bff 55%, #ff7aa8 100%);
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.18);
  }
  .meta { min-width: 0; flex: 1; }
  .title {
    font-size: 14px; font-weight: 600; letter-spacing: -0.1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .artist {
    font-size: 12.5px; color: var(--label-2); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Equalizer bars, tinted like the artwork; still when paused */
  .eq { display: flex; align-items: center; gap: 2.5px; height: 18px; flex: none; margin-right: 2px; }
  .eq i {
    width: 3px; height: 100%; border-radius: 2px;
    background: linear-gradient(#b9a4ff, #8aa2ff);
    transform: scaleY(0.25); transform-origin: 50% 50%;
    transition: transform 200ms ease;
  }
  .open.playing .eq i { animation: eq 0.9s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: -0.35s !important; }
  .eq i:nth-child(3) { animation-delay: -0.6s !important; }
  .eq i:nth-child(4) { animation-delay: -0.15s !important; }
  @keyframes eq {
    0% { transform: scaleY(0.25); }
    40% { transform: scaleY(0.9); }
    70% { transform: scaleY(0.45); }
    100% { transform: scaleY(1); }
  }

  .progress { display: flex; align-items: center; gap: 10px; margin-top: 12px; height: 14px; }
  .t {
    font-size: 11px; color: var(--label-3); font-variant-numeric: tabular-nums;
    width: 32px; flex: none;
  }
  .t.end { text-align: right; }
  .bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 33%; border-radius: 2px; background: rgba(255, 255, 255, 0.85); }

  .controls { display: flex; justify-content: center; align-items: center; gap: 22px; margin-top: 8px; height: 34px; }
  button {
    all: unset; display: grid; place-items: center;
    width: 34px; height: 34px; border-radius: 50%;
    color: var(--label);
    transition: background 120ms ease, transform 120ms ease;
  }
  button:hover { background: rgba(255, 255, 255, 0.1); }
  button:active { transform: scale(0.88); background: rgba(255, 255, 255, 0.16); }
  button svg { fill: currentColor; stroke: currentColor; stroke-linejoin: round; }
  #prev svg, #next svg { width: 20px; height: 20px; stroke-width: 1.6; }
  #play svg { width: 24px; height: 24px; stroke-width: 2; }
  .icon-pause { display: none; }
  .playing .icon-play { display: none; }
  .playing .icon-pause { display: inline; }
</style>
</head>
<body class="playing">
  <div class="island">
    <div class="shape" id="shape">
      <div class="content">
        <div class="row">
          <div class="art"></div>
          <div class="meta">
            <div class="title">Demo Track</div>
            <div class="artist">island preview</div>
          </div>
          <div class="eq"><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="progress">
          <span class="t">1:12</span>
          <div class="bar"><i></i></div>
          <span class="t end">-2:31</span>
        </div>
        <div class="controls">
          <button id="prev" title="Previous">
            <svg viewBox="0 0 24 24"><path d="M21 6.5 12.5 12 21 17.5Z M12 6.5 3.5 12 12 17.5Z"/></svg>
          </button>
          <button id="play" title="Play/Pause">
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M7.5 5.5 19 12 7.5 18.5Z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" stroke="none"><rect x="6" y="5" width="4.2" height="14" rx="1.3"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3"/></svg>
          </button>
          <button id="next" title="Next">
            <svg viewBox="0 0 24 24"><path d="M3 6.5 11.5 12 3 17.5Z M12 6.5 20.5 12 12 17.5Z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
<script>
  // Damped spring sampled into a CSS linear() easing, so CSS transitions
  // move like a real spring (overshoot and settle) instead of a bezier.
  function spring({ stiffness, damping, mass = 1 }) {
    const dt = 1 / 600;
    let x = 0, v = 0, t = 0;
    const samples = [0];
    while (t < 2) {
      const a = (-stiffness * (x - 1) - damping * v) / mass;
      v += a * dt; x += v * dt; t += dt;
      samples.push(x);
      if (t > 0.1 && Math.abs(x - 1) < 0.001 && Math.abs(v) < 0.01) break;
    }
    const n = 64;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      pts.push(samples[Math.round((i / n) * (samples.length - 1))].toFixed(4));
    }
    pts[n] = '1';
    return { easing: `linear(${pts.join(', ')})`, ms: Math.round(t * 1000) };
  }

  const root = document.documentElement.style;
  if (CSS.supports('transition-timing-function', 'linear(0, 1)')) {
    const open = spring({ stiffness: 240, damping: 21 });   // ~6% overshoot
    const close = spring({ stiffness: 320, damping: 38 });  // no overshoot
    root.setProperty('--ease-open', open.easing);
    root.setProperty('--dur-open', open.ms + 'ms');
    root.setProperty('--ease-close', close.easing);
    root.setProperty('--dur-close', close.ms + 'ms');
  }

  const body = document.body;
  const shape = document.getElementById('shape');

  window.island.onState((s) => {
    if (s === 'open') {
      // Two frames so the collapsed state is committed before the transition starts.
      requestAnimationFrame(() => requestAnimationFrame(() => body.classList.add('open')));
    } else {
      body.classList.remove('open');
      window.island.setHover(false);
    }
  });

  // Mouse input is off for the transparent window; turn it on over the shape.
  shape.addEventListener('mouseenter', () => window.island.setHover(true));
  shape.addEventListener('mouseleave', () => window.island.setHover(false));

  // Demo only until the media module lands.
  document.getElementById('play').addEventListener('click', () => body.classList.toggle('playing'));
</script>
</body>
</html>
