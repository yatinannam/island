<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: #fff;
    user-select: none;
  }
  /* The pill. Collapsed = tucked up into the top edge, tiny, invisible. */
  .pill {
    position: absolute;
    left: 50%; top: 10px;
    width: 380px; height: 130px;
    margin-left: -190px;
    border-radius: 30px;
    padding: 16px 18px;
    box-sizing: border-box;
    background: rgba(24, 24, 30, 0.55);
    -webkit-backdrop-filter: blur(30px) saturate(1.6);
    backdrop-filter: blur(30px) saturate(1.6);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.28),
      inset 0 -1px 0 rgba(255, 255, 255, 0.04),
      0 14px 40px rgba(0, 0, 0, 0.45);
    transform-origin: 50% 0;
    transform: translateY(-40px) scale(0.35, 0.12);
    opacity: 0;
    transition: transform 0.45s var(--spring), opacity 0.2s ease, border-radius 0.45s var(--spring);
    overflow: hidden;
  }
  .pill.open {
    transform: none;
    opacity: 1;
  }
  /* faint noise for the frosted feel */
  .pill::before {
    content: "";
    position: absolute; inset: 0;
    opacity: 0.07;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* soft top sheen */
  .pill::after {
    content: "";
    position: absolute; left: 0; right: 0; top: 0; height: 45%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.10), rgba(255,255,255,0));
    pointer-events: none;
  }
  /* acrylic mode: window itself is the pill (rectangular, DWM-rounded corners) */
  body.acrylic .pill {
    left: 0; top: 0; margin: 0; width: 100%; height: 100%;
    border-radius: 0; border: 0; box-shadow: none;
    background: rgba(24, 24, 30, 0.25);
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }

  .row { display: flex; gap: 14px; align-items: center; position: relative; z-index: 1; }
  .art {
    width: 62px; height: 62px; border-radius: 14px; flex: none;
    background: linear-gradient(135deg, #7aa8ff, #c06cff 60%, #ff8fb1);
    box-shadow: 0 6px 18px rgba(120, 140, 255, 0.45);
  }
  .meta { min-width: 0; flex: 1; }
  .title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 12.5px; opacity: 0.65; margin-top: 2px; }
  .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: rgba(255,255,255,0.9); border-radius: 2px; }
  .pill.open .bar i { animation: prog 30s linear infinite; }
  @keyframes prog { to { width: 100%; } }
  .ctrl { display: flex; justify-content: center; gap: 26px; margin-top: 12px; font-size: 18px; position: relative; z-index: 1; opacity: 0.9; }
  .ctrl span { cursor: default; }
  .mode { position: absolute; right: 12px; top: 8px; font-size: 10px; opacity: 0.4; z-index: 1; }
</style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="mode" id="mode"></div>
    <div class="row">
      <div class="art"></div>
      <div class="meta">
        <div class="title">Placeholder Song Title</div>
        <div class="artist">Placeholder Artist</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <div class="ctrl"><span>⏮</span><span>⏯</span><span>⏭</span></div>
  </div>
<script>
  const mode = new URLSearchParams(location.search).get('mode');
  document.body.classList.add(mode === 'acrylic' ? 'acrylic' : 'fake');
  document.getElementById('mode').textContent = mode;
  const pill = document.getElementById('pill');
  window.island.onState((s) => {
    if (s === 'open') requestAnimationFrame(() => pill.classList.add('open'));
    else pill.classList.remove('open');
  });
</script>
</body>
</html>
