<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>island settings</title>
<style>
  :root {
    color-scheme: dark;
    --accent: #0078d4;
    --accent-ui: color-mix(in srgb, var(--accent) 70%, white);
    --on-accent: #000;
    --text: #fff;
    --text-2: rgba(255, 255, 255, 0.72);
    --text-3: rgba(255, 255, 255, 0.5);
    --card: rgba(255, 255, 255, 0.055);
    --card-border: rgba(255, 255, 255, 0.07);
    --control: rgba(255, 255, 255, 0.06);
    --control-hover: rgba(255, 255, 255, 0.09);
    --control-border: rgba(255, 255, 255, 0.09);
    --track: rgba(255, 255, 255, 0.54);
    --thumb: #454545;
    --divider: rgba(255, 255, 255, 0.08);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --accent-ui: color-mix(in srgb, var(--accent) 80%, black);
      --on-accent: #fff;
      --text: #1a1a1a;
      --text-2: rgba(0, 0, 0, 0.62);
      --text-3: rgba(0, 0, 0, 0.45);
      --card: rgba(255, 255, 255, 0.5);
      --card-border: rgba(0, 0, 0, 0.06);
      --control: rgba(255, 255, 255, 0.7);
      --control-hover: rgba(249, 249, 249, 0.9);
      --control-border: rgba(0, 0, 0, 0.08);
      --track: rgba(0, 0, 0, 0.45);
      --thumb: #fff;
      --divider: rgba(0, 0, 0, 0.08);
    }
  }
  html, body {
    margin: 0; background: transparent; color: var(--text);
    font: 14px/20px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none; cursor: default; overflow: hidden;
  }
  [hidden] { display: none !important; }
  main { padding: 16px; }
  .shown main { animation: rise 260ms cubic-bezier(0.1, 0.9, 0.2, 1); }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }

  header { display: flex; align-items: center; gap: 10px; margin: 0 2px 14px; }
  .logo { width: 28px; height: 10px; border-radius: 0 0 6px 6px; background: var(--text); opacity: 0.9; }
  h1 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; }
  .sub { font-size: 12px; color: var(--text-3); }

  h2 { font-size: 12px; font-weight: 600; color: var(--text-2); margin: 14px 4px 6px; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 8px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 28px; }
  .row + .row { border-top: 1px solid var(--divider); }
  .row.stack { flex-direction: column; align-items: stretch; gap: 6px; }
  .row.disabled { opacity: 0.45; pointer-events: none; }
  .label { flex: 1; }
  .line { display: flex; align-items: center; gap: 12px; }
  .value { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; }
  .note { font-size: 12px; line-height: 16px; color: var(--text-3); }

  /* Segmented control */
  .seg { display: flex; padding: 2px; border-radius: 6px; background: var(--control); border: 1px solid var(--control-border); }
  .seg button {
    all: unset; padding: 3px 14px; border-radius: 4px; font-size: 13px; color: var(--text-2);
    transition: background 120ms, color 120ms;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--accent-ui); color: var(--on-accent); font-weight: 600; }

  /* Windows 11 style slider */
  input[type=range] {
    -webkit-appearance: none; appearance: none; flex: 1; height: 20px; margin: 0; background: transparent;
    --pct: 50%;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent-ui) var(--pct), var(--track) var(--pct));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent-ui) 0 5px, var(--thumb) 5.5px);
    box-shadow: 0 0 0 1px var(--control-border), 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: background 100ms;
  }
  input[type=range]:hover::-webkit-slider-thumb { background: radial-gradient(circle, var(--accent-ui) 0 6.5px, var(--thumb) 7px); }
  input[type=range]:active::-webkit-slider-thumb { background: radial-gradient(circle, var(--accent-ui) 0 4px, var(--thumb) 4.5px); }
  input[type=range]:focus { outline: none; }

  /* Windows 11 style toggle */
  .toggle {
    all: unset; position: relative; width: 40px; height: 20px; border-radius: 10px; flex: none;
    border: 1px solid var(--text-2); box-sizing: border-box; transition: background 120ms, border-color 120ms;
  }
  .toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--text-2); transition: transform 160ms cubic-bezier(0.2, 0.9, 0.3, 1.2), background 120ms;
  }
  .toggle.on { background: var(--accent-ui); border-color: var(--accent-ui); }
  .toggle.on::after { transform: translateX(20px); background: var(--on-accent); }

  footer { display: flex; gap: 8px; margin-top: 14px; }
  footer button {
    all: unset; flex: 1; text-align: center; padding: 6px 0; border-radius: 6px; font-size: 13px;
    background: var(--control); border: 1px solid var(--control-border);
    transition: background 120ms;
  }
  footer button:hover { background: var(--control-hover); }
  footer button:active { opacity: 0.8; }
  footer button.primary { background: var(--accent-ui); color: var(--on-accent); border-color: transparent; font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo"></div>
    <h1>island</h1>
    <span class="sub">Settings</span>
  </header>

  <h2>Look</h2>
  <div class="card">
    <div class="row">
      <span class="label">Background</span>
      <div class="seg" id="bg">
        <button data-glass="true">Glass</button>
        <button data-glass="false">Solid</button>
      </div>
    </div>
    <div class="row stack" id="glassNoteRow" hidden>
      <span class="note" id="glassNote"></span>
    </div>
    <div class="row stack" id="transRow">
      <div class="line"><span class="label">Transparency</span><span class="value" id="transValue"></span></div>
      <input type="range" id="transparency" min="0" max="100" step="1">
    </div>
    <div class="row stack">
      <div class="line"><span class="label">Song color</span><span class="value" id="songValue"></span></div>
      <input type="range" id="songColor" min="0" max="100" step="1">
    </div>
  </div>

  <h2>Behavior</h2>
  <div class="card">
    <div class="row stack">
      <div class="line"><span class="label">Open delay</span><span class="value" id="openValue"></span></div>
      <input type="range" id="openDelay" min="0" max="600" step="10">
    </div>
    <div class="row stack">
      <div class="line"><span class="label">Close delay</span><span class="value" id="closeValue"></span></div>
      <input type="range" id="closeDelay" min="0" max="1000" step="10">
    </div>
    <div class="row">
      <span class="label">Start with Windows</span>
      <button class="toggle" id="startup" role="switch"></button>
    </div>
    <div class="row">
      <span class="label">Always show icon on taskbar</span>
      <button class="toggle" id="trayShown" role="switch"></button>
    </div>
  </div>

  <footer>
    <button id="pin">Pin island open</button>
    <button id="quit">Quit</button>
  </footer>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let state = null;

  const fmtPct = (v) => `${v}%`;
  const fmtSong = (v) => (v === 0 ? 'Off' : `${v}%`);
  const fmtMs = (v) => `${v} ms`;
  const sliders = [
    ['transparency', 'transValue', fmtPct],
    ['songColor', 'songValue', fmtSong],
    ['openDelay', 'openValue', fmtMs],
    ['closeDelay', 'closeValue', fmtMs],
  ];

  function paintSlider(input) {
    const pct = ((input.value - input.min) / (input.max - input.min)) * 100;
    input.style.setProperty('--pct', pct + '%');
  }

  function render(p) {
    state = p;
    document.documentElement.style.setProperty('--accent', p.accent);
    const v = p.values;
    const glassAvailable = p.windowsTransparency && !p.forceSolid;
    const glassOn = v.glass && glassAvailable;
    for (const b of $('bg').children) b.classList.toggle('on', (b.dataset.glass === 'true') === glassOn);
    $('bg').parentElement.classList.toggle('disabled', !glassAvailable);
    // Explain why glass is unavailable, or what glass costs.
    $('glassNoteRow').hidden = glassAvailable && !glassOn;
    $('glassNote').textContent = !p.windowsTransparency
      ? 'Transparency effects are off in Windows settings, so the island is solid.'
      : p.forceSolid
        ? 'Started with --solid.'
        : 'Glass hides the island from screenshots and recordings. Switch to Solid to record it.';
    $('transRow').classList.toggle('disabled', !glassOn);
    for (const [id, valueId, fmt] of sliders) {
      const input = $(id);
      if (document.activeElement !== input) input.value = v[id];
      $(valueId).textContent = fmt(Number(input.value));
      paintSlider(input);
    }
    $('startup').classList.toggle('on', p.startWithWindows);
    $('startup').setAttribute('aria-checked', String(p.startWithWindows));
    $('trayShown').classList.toggle('on', p.trayShown);
    $('trayShown').setAttribute('aria-checked', String(p.trayShown));
    $('pin').textContent = p.pinned ? 'Unpin island' : 'Pin island open';
    $('pin').classList.toggle('primary', p.pinned);
    requestAnimationFrame(() => window.settings.resize(document.documentElement.scrollHeight));
  }

  for (const [id, valueId, fmt] of sliders) {
    const input = $(id);
    input.addEventListener('input', () => {
      $(valueId).textContent = fmt(Number(input.value));
      paintSlider(input);
      window.settings.set({ [id]: Number(input.value) });
    });
  }
  for (const b of $('bg').children) {
    b.addEventListener('click', () => window.settings.set({ glass: b.dataset.glass === 'true' }));
  }
  $('startup').addEventListener('click', () => {
    window.settings.action(state && state.startWithWindows ? 'start-with-windows-off' : 'start-with-windows-on');
  });
  $('trayShown').addEventListener('click', () => {
    window.settings.action(state && state.trayShown ? 'tray-shown-off' : 'tray-shown-on');
  });
  $('pin').addEventListener('click', () => window.settings.action('pin'));
  $('quit').addEventListener('click', () => window.settings.action('quit'));
  addEventListener('keydown', (e) => { if (e.key === 'Escape') window.settings.action('hide'); });

  window.settings.onUpdate(render);
  window.settings.onShown(() => {
    document.body.classList.remove('shown');
    void document.body.offsetWidth;
    document.body.classList.add('shown');
  });
  window.settings.get().then(render);
</script>
</body>
</html>
